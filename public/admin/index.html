<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CERO25 — Panel de redacción</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='9' fill='none' stroke='%23ff0a3c' stroke-width='2.6'/%3E%3Cpath d='M12 12l2.6-3.4M12 12l2.4 4.6' stroke='%23ff0a3c' stroke-width='2.6' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
</head>
<body>

<!-- ============ LOGIN ============ -->
<div class="login-wrap" id="loginView" hidden>
  <form class="login-card" id="loginForm">
    <div class="login-logo">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="9"></circle>
        <path d="M12 12l2.6-3.4"></path>
        <path d="M12 12l2.4 4.6"></path>
      </svg>
      <span>CERO<b>25</b></span>
    </div>
    <p class="login-sub">Panel de redacción</p>
    <label class="fld"><span>Correo</span>
      <input type="email" id="loginEmail" autocomplete="username" required>
    </label>
    <label class="fld"><span>Contraseña</span>
      <input type="password" id="loginPass" autocomplete="current-password" required>
    </label>
    <p class="login-error" id="loginError" hidden></p>
    <button type="submit" class="btn-acc">Entrar</button>
    <p class="login-demo" id="loginDemo">Acceso de demostración<br>
      <b>admin@cero25.com</b> / cero25admin · <b>editor@cero25.com</b> / cero25editor</p>
  </form>
</div>

<!-- ============ APP ============ -->
<div class="app" id="appView" hidden>
  <aside class="side">
    <a class="side-logo" href="../index.html" title="Ver el sitio">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="9"></circle>
        <path d="M12 12l2.6-3.4"></path>
        <path d="M12 12l2.4 4.6"></path>
      </svg>
      <span>CERO<b>25</b></span>
    </a>

    <nav class="side-nav" id="sideNav">
      <a href="#/panel" data-view="panel">
        <svg class="ic" viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/></svg>
        <span>Panel</span>
      </a>
      <a href="#/articulos" data-view="articulos">
        <svg class="ic" viewBox="0 0 24 24"><path d="M7 3h8l4 4v14H7z"/><path d="M15 3v4h4"/><path d="M10 12h6M10 16h6"/></svg>
        <span>Artículos</span>
      </a>
      <a href="#/portada" data-view="portada">
        <svg class="ic" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18"/><path d="M10 10v10"/></svg>
        <span>Portada</span>
      </a>
      <a href="#/medios" data-view="medios">
        <svg class="ic" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="M3 17l5-5 4 4 3-3 6 6"/></svg>
        <span>Medios</span>
      </a>
      <a href="#/papelera" data-view="papelera">
        <svg class="ic" viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/><path d="M10 11v6M14 11v6"/></svg>
        <span>Papelera</span>
      </a>
      <a href="#/programas" data-view="programas">
        <svg class="ic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0"/><path d="M12 18v3"/></svg>
        <span>Pódcast</span>
      </a>
      <a href="#/autores" data-view="autores" data-solo-admin>
        <svg class="ic" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17.5" cy="9.5" r="2.5"/><path d="M16.5 14.5c2.8.3 4.5 2.4 4.5 5"/></svg>
        <span>Autores</span>
      </a>
      <a href="#/boletin" data-view="boletin" data-solo-admin>
        <svg class="ic" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M4 7l8 6 8-6"/></svg>
        <span>Boletín</span>
      </a>
      <a href="#/ajustes" data-view="ajustes" data-solo-admin>
        <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v3M12 18.2v3M2.8 12h3M18.2 12h3M5.5 5.5l2.1 2.1M16.4 16.4l2.1 2.1M18.5 5.5l-2.1 2.1M7.6 16.4l-2.1 2.1"/></svg>
        <span>Ajustes</span>
      </a>
    </nav>

    <div class="side-foot">
      <a href="../index.html" class="side-link" target="_blank" rel="noopener">
        <svg class="ic" viewBox="0 0 24 24"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M20 14v5a1 1 0 01-1 1H5a1 1 0 01-1-1V5a1 1 0 011-1h5"/></svg>
        Ver el sitio
      </a>
      <div class="side-user">
        <span class="side-avatar" id="userAvatar">25</span>
        <div class="side-user-txt">
          <b id="userName"></b>
          <span class="side-rol" id="userRol"></span>
        </div>
      </div>
      <button class="side-link" id="btnLogout" type="button">
        <svg class="ic" viewBox="0 0 24 24"><path d="M9 4H5a1 1 0 00-1 1v14a1 1 0 001 1h4"/><path d="M15 8l4 4-4 4"/><path d="M19 12H9"/></svg>
        Cerrar sesión
      </button>
    </div>
  </aside>

  <main class="main" id="mainView"></main>
</div>

<div class="toast" id="toast" hidden></div>

<script src="../data.js"></script>
<script src="../config.js"></script>
<script src="../store.js"></script>
<script src="../supabase/driver-supabase.js"></script>
<script src="admin.js"></script>
</body>
</html>
