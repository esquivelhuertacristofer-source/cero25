<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CERO25 — Autor</title>
<meta name="description" content="Perfil y artículos del equipo de CERO25." id="metaDesc">
<meta name="theme-color" content="#ff0a3c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='9' fill='none' stroke='%23ff0a3c' stroke-width='2.6'/%3E%3Cpath d='M12 12l2.6-3.4M12 12l2.4 4.6' stroke='%23ff0a3c' stroke-width='2.6' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
</head>
<body>

<header class="hdr" id="hdr">
  <div class="hdr-in">
    <a class="logo" href="index.html" aria-label="CERO25 — inicio">
      <svg class="logo-clock" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="9"></circle>
        <path d="M12 12l2.6-3.4"></path>
        <path d="M12 12l2.4 4.6"></path>
      </svg>
      <span class="logo-word">CERO<span class="n25">25</span></span>
    </a>
    <form class="search" role="search" action="seccion.html" method="get">
      <svg class="search-ico" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="11" cy="11" r="7"></circle><path d="M16.5 16.5L21 21"></path>
      </svg>
      <input name="q" type="search" aria-label="Descubre lo que sea" autocomplete="off">
      <span class="search-ph">Descubre <b>lo que sea</b></span>
    </form>
    <div class="hdr-right">
      <nav class="hdr-links" aria-label="Medios">
        <a href="seccion.html?tipo=video" class="hdr-link">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="4.5" width="19" height="15" rx="3.5"></rect><path d="M10.4 9.3v5.4l4.4-2.7z" fill="currentColor" stroke="none"></path></svg>
          <span>Vídeos</span>
        </a>
        <a href="seccion.html?cat=podcast" class="hdr-link">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 14v-2a8 8 0 0116 0v2"></path><rect x="2.6" y="13.4" width="4.6" height="7" rx="2.3"></rect><rect x="16.8" y="13.4" width="4.6" height="7" rx="2.3"></rect></svg>
          <span>Pódcast</span>
        </a>
      </nav>
    </div>
  </div>
</header>

<main>
  <div class="autor-hero" id="autorHero"></div>
  <div class="sec-grid" id="grid"></div>
</main>

<footer class="ftr">
  <div class="ftr-legal">
    <span>© 2026 CERO25</span>
    <span class="ftr-legal-links"><a href="index.html">Portada</a><a href="seccion.html">Archivo</a></span>
  </div>
</footer>

<script src="data.js"></script>
<script src="config.js"></script>
<script src="store.js"></script>
<script src="supabase/driver-supabase.js"></script>
<script>
(function () {
  'use strict';
  var S = window.CeroStore;
  var id = new URLSearchParams(location.search).get('id');
  var hero = document.getElementById('autorHero');
  var grid = document.getElementById('grid');

  function esc(t) {
    return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function iniciales(nombre) {
    return (nombre || '').split(' ').map(function (p) { return p[0]; })
      .join('').slice(0, 2).toUpperCase();
  }

  Promise.all([S.autores(), S.categorias(), S.articulos({})]).then(function (r) {
    var autores = r[0], cats = r[1], arts = r[2];
    var a = autores.find(function (x) { return x.id === id; });

    if (!a) {
      hero.innerHTML = '<div class="autor-in"><h1 class="autor-nombre">Autor no encontrado</h1>' +
        '<p class="autor-rol"><a href="index.html">Volver a la portada</a></p></div>';
      return;
    }

    var suyos = arts.filter(function (x) { return x.autor === a.id; });
    var vistas = suyos.reduce(function (s, x) { return s + (x.vistas || 0); }, 0);

    document.title = 'CERO25 — ' + a.nombre;
    var md = document.getElementById('metaDesc');
    if (md) md.setAttribute('content', a.nombre + (a.rol ? ', ' + a.rol : '') + ' en CERO25. ' + suyos.length + ' publicaciones.');

    var ld = document.createElement('script');
    ld.type = 'application/ld+json';
    ld.textContent = JSON.stringify({
      '@context': 'https://schema.org', '@type': 'ProfilePage',
      mainEntity: {
        '@type': 'Person', name: a.nombre, jobTitle: a.rol || undefined,
        worksFor: { '@type': 'Organization', name: 'CERO25' }
      }
    });
    document.head.appendChild(ld);

    hero.innerHTML =
      '<div class="autor-in">' +
      '<span class="autor-avatar">' + esc(iniciales(a.nombre)) + '</span>' +
      '<div>' +
      '<p class="autor-eyebrow">Equipo CERO25</p>' +
      '<h1 class="autor-nombre">' + esc(a.nombre) + '</h1>' +
      (a.rol ? '<p class="autor-rol">' + esc(a.rol) + '</p>' : '') +
      '<p class="autor-datos">' + suyos.length +
        (suyos.length === 1 ? ' publicación' : ' publicaciones') +
        (vistas ? ' · ' + vistas.toLocaleString('es') + ' lecturas' : '') + '</p>' +
      '</div></div>';

    if (!suyos.length) {
      grid.innerHTML = '<p class="sec-vacio" style="grid-column:1/-1">Todavía no hay publicaciones de esta firma.</p>';
      return;
    }
    grid.innerHTML = suyos.map(function (x) {
      var m = x.img
        ? '<img src="' + esc(x.img) + '" alt="" loading="lazy">'
        : '<div class="g-art ' + esc(x.art || 'g8') + ' g-1610" data-glyph="' + esc(x.glyph || '') + '"></div>';
      var c = cats.find(function (y) { return y.slug === x.categoria; });
      return '<a class="study-card" href="articulo.html?slug=' + esc(x.slug) + '">' + m +
        '<div class="sc-txt"><span class="tag">' + esc(c ? c.nombre : x.categoria) + '</span>' +
        '<h3>' + esc(x.titulo) + '</h3>' +
        '<span style="font-size:12.5px;color:#6b6b6b">' + S.tiempoRelativo(x.fecha) + '</span>' +
        '</div></a>';
    }).join('');
  });
})();
</script>
</body>
</html>
